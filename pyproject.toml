[project]
name = "prompt-injection-bench"
version = "0.1.0"
description = "A hand-built indirect prompt-injection attack corpus and an honest ASR/FPR benchmark comparing four real defenses (regex tripwire, structural spotlighting, LLM classifier, combined) on a tool-using Claude agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eshanya Marathe" }]
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
injection-bench = "prompt_injection_bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_injection_bench = ["corpus/*.jsonl", "eval_data/cassettes/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
